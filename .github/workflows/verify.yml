name: Foundation verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    name: Node foundation (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm demo
      - name: Electron integration smoke (sandbox enabled)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop
      - name: Electron integration smoke (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:desktop
